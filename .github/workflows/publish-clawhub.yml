name: Publish to ClawHub

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish skill
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        # Pinned by commit SHA rather than tag: a tag can be moved, a SHA cannot.
        # v4.1.1 ran on Node 20, which GitHub now forces onto Node 24 and warns
        # about; v7 targets node24 natively.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish root skill
        env:
          CLAW_HUB_TOKEN: ${{ secrets.CLAW_HUB_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes clawhub@0.23.1 login --token "$CLAW_HUB_TOKEN"
          npx --yes clawhub@0.23.1 skill publish . \
            --json \
            --tags latest \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF_NAME" \
            --source-path .
