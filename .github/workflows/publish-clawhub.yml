name: Publish to ClawHub

on:
  push:
    tags:
      # Only release tags publish. Previously any tag did, which meant a
      # scratch or annotation tag would push a release to the registry.
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  publish:
    name: Publish skill
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        # Pinned by commit SHA rather than tag: a tag can be moved, a SHA cannot.
        # v4.1.1 ran on Node 20, which GitHub now forces onto Node 24 and warns
        # about; v7 targets node24 natively.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The annotated tag message becomes the changelog, so the tag object
          # itself has to be present, not just the commit it points at.
          fetch-depth: 0

      - name: Publish root skill
        env:
          CLAW_HUB_TOKEN: ${{ secrets.CLAW_HUB_TOKEN }}
          SKILL_SLUG: line-oa-chat-send
        run: |
          set -euo pipefail

          # Without --version the CLI defaults to "next patch", so the published
          # version is whatever follows the last one -- not what this tag says.
          # v0.1.4 matched 0.1.4 by coincidence; a v0.2.0 tag would have shipped
          # as 0.1.5 and diverged silently from then on.
          version="${GITHUB_REF_NAME#v}"
          printf 'Publishing tag %s as version %s\n' "$GITHUB_REF_NAME" "$version"

          # v0.1.4 published with "No changelog provided" and was not promoted to
          # Latest, while v0.1.3 carried a changelog and was. The two may not be
          # causally linked -- promotion could simply be asynchronous -- but a
          # release should ship its own notes either way, rather than relying on
          # the registry to infer them from a diff.
          #
          # The annotated tag message is already written as release notes, so use
          # it. Check the object type first: for a lightweight tag %(contents)
          # falls back to the commit message, which would quietly publish the
          # last commit subject as the release notes.
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
            changelog="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          else
            changelog=""
            printf 'WARNING: %s is a lightweight tag; publishing without a changelog.\n' "$GITHUB_REF_NAME" >&2
            printf 'WARNING: annotate release tags (git tag -a) so the release ships its notes.\n' >&2
          fi

          # Publish from a staging copy rather than the repo root. openspec/ is
          # change proposals and specs, .claude/ is local agent tooling; neither
          # is useful to someone installing the skill, and both are large.
          #
          # The staging directory is named after the skill, because the CLI
          # derives the slug from the folder name when --slug is absent.
          # Publishing from a bare mktemp -d created a whole new skill named
          # after the temp directory. --slug below is the real guard; this is
          # belt and braces.
          staging="$(mktemp -d)/${SKILL_SLUG}"
          mkdir -p "$staging"
          rsync -a \
            --exclude '.git/' \
            --exclude 'openspec/' \
            --exclude '.claude/' \
            ./ "$staging/"
          printf 'Staged %s files (repo has %s)\n' \
            "$(find "$staging" -type f | wc -l)" \
            "$(find . -type f -not -path './.git/*' | wc -l)"

          # Excluding directories is exactly what breaks relative links, so the
          # staged tree is checked before anything is uploaded. A publish with
          # dead links is what this repository shipped before v0.1.4.
          bash scripts/check_doc_links.sh "$staging"

          npx --yes clawhub@0.23.1 login --token "$CLAW_HUB_TOKEN"

          # --slug and --name are explicit so the published identity never
          # depends on where the files happen to sit on disk.
          out="$(npx --yes clawhub@0.23.1 skill publish "$staging" \
            --json \
            --slug "$SKILL_SLUG" \
            --name "$SKILL_SLUG" \
            --version "$version" \
            --changelog "$changelog" \
            --tags latest \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF_NAME" \
            --source-path .)"
          printf '%s\n' "$out"

          # Confirm where it actually landed. This cannot prevent a mispublish,
          # but it makes one loud instead of silent -- v0.1.5 went to a skill
          # named after a temp directory and nothing in the run said so.
          published_slug="$(printf '%s' "$out" | jq -r '.slug')"
          if [ "$published_slug" != "$SKILL_SLUG" ]; then
            printf 'ERROR: published to slug %s, expected %s\n' "$published_slug" "$SKILL_SLUG" >&2
            exit 1
          fi
          printf 'Published %s@%s\n' "$published_slug" "$version"
